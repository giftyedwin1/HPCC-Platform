# S3 storage plane example for HPCC on EKS
# Uses IAM roles for authentication (IRSA - IAM Roles for Service Accounts)
#
# Prerequisites:
#   1. Create an S3 bucket
#   2. Create an IAM role with S3 access policy
#   3. Associate the role with the HPCC service account via IRSA
#
# Usage:
#   helm install myhpcc hpcc/hpcc -f values-s3.yaml

storage:
  planes:
  - name: dali
    storageClass: ""
    storageSize: 1Gi
    prefix: "/var/lib/HPCCSystems/dalistorage"
    category: dali
  - name: sasha
    storageClass: ""
    storageSize: 1Gi
    prefix: "/var/lib/HPCCSystems/sashastorage"
    category: sasha
  - name: dll
    storageClass: ""
    storageSize: 1Gi
    prefix: "/var/lib/HPCCSystems/queries"
    category: dll
  - name: s3data
    prefix: "s3:s3data"
    category: data
    blockedSequentialIO: 4194304   # 4MB — batches compressed block reads for cloud I/O
    blockedRandomIO: 65536         # 64KB — for index node reads
    storageapi:
      type: s3
      region: us-east-1
      buckets:
      - name: my-hpcc-data-bucket
  - name: mydropzone
    prefix: "/var/lib/HPCCSystems/mydropzone"
    category: lz
  - name: spill
    prefix: "/var/lib/HPCCSystems/hpcc-spill"
    category: spill
